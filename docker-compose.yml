services:
  db:
    image: postgres:16
    container_name: beta-v1-db
    environment:
      POSTGRES_DB: beta
      POSTGRES_USER: beta
      POSTGRES_PASSWORD: beta_local_only
    ports:
      - "5432:5432"
    volumes:
      - beta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beta -d beta"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  beta_pgdata:
