[project]
name = "beta-v1-backend"
version = "0.1.0"
description = "Backend Beta v1"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2.0",
  "alembic", "psycopg[binary]", "pyjwt", "pwdlib[argon2]",
  "pydantic-settings", "python-multipart"
]

[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]